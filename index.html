<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <link rel="stylesheet" href="css/style.css" >
    <link rel="shortcut icon" href="./src/Logos/logo (1).png" type="image/x-icon">
    <title>🦖 DinoPedia 🦖</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>

    <header class="encabezado">
      <img src="./src/Logos/logo (1).png" alt="Logo">
      <nav class="menu">
        <a href="" class="extra">Nosotros</a>
        <a href="" class="extra">Productos</a>
        <a href="" class="extra">Galeria</a>
        <a href="" class="contactos">Contactos</a>
      </nav>
    </header>

    <main class="principal">

      <section class="carousel">
        <div id="carouselExample" class="carousel slide">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="./src/Carousel/Meme1.jpeg" class="d-block w-100" alt="Chris Pratt" />
            </div>
            <div class="carousel-item">
              <img src="./src/Carousel/Meme2.jpeg" class="d-block w-100" alt="Quien tiene hambre?" />
            </div>
            <div class="carousel-item">
              <img src="./src/Carousel/Meme3.jpeg" class="d-block w-100" alt="Quieres que te aplauda?" />
            </div>
            <div class="carousel-item">
              <img src="./src/Carousel/Meme4.jpeg" class="d-block w-100" alt="༼ つ ◕_◕ ༽つ" />
            </div>
          </div>
          <button class="carousel-control-prev"="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </section>

      <div class="contenedor_form">
        <form action="">
        <label form="" id="nombre"><h1> NOMBRE </h1></label>
        <input type="text" name="filtro" id="filtro" />
        <button type="submit" id="buscar">buscar</button>
        </form>
      </div>
      <div class="contenedor"></div>

    </main>

    <footer class="pie">
      <div class="info">
        <img src="./src/Logos/logo (1).png" alt="Logo">
        <p>Esta pagina esta dedicada a recopilar <br> todos los datos acerca  de nuestro equipo <br> y preservar la conciencia acerca de los dinosaurios</p>
      </div>

      <div class="redes">
        <div class="logos">
          <img src="./src/Logos/GitHub.png" alt="GitHub">
          <img src="./src/Logos/WhatsApp.png" alt="WhatsApp">
          <img src="./src/Logos/Instagram.png" alt="Instagram">
        </div>
          <div class="mapa">
              <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1376.8270298853067!2d-58.46461167854809!3d-34.83951444144623!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcd183c5f866ff%3A0x5e7ac230c436ad7b!2sEscuela%20De%20Educaci%C3%B3n%20Secundaria%20T%C3%A9cnica%20N%C2%BA1!5e0!3m2!1ses!2sar!4v1777835374862!5m2!1ses!2sar" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
      </div>

      <div class="nav">
        <a href="">Nosotros</a>
        <a href="">Productos</a>
        <a href="">Galeria</a>
        <a href="">Contacto</a>
      </div>
    </footer>

    <script type="module" src="Script/Main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</html>
